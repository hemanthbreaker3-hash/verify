<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Success — AniZoneFlix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364); color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); max-width: 480px; width: 100%; padding: 40px 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center; }
        .badge { display: inline-block; background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; font-size: 12px; font-weight: 700; padding: 6px 18px; border-radius: 50px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        h2 { font-size: 26px; font-weight: 700; margin-bottom: 12px; color: #fff; }
        p { color: #d1d5db; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .btn { display: inline-block; width: 100%; background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; padding: 16px; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,176,155,0.4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,176,155,0.6); }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🎉 Success!</span>
        <h2>Verification Complete</h2>
        <img src="{{ animation_url }}" alt="Redirecting" style="display:block;max-width:220px;width:100%;height:auto;margin:0 auto 18px;border-radius:12px"><p>Verification complete. Redirecting to Telegram, please wait.</p>
        {% if redirect_url %}
            <a href="{{ redirect_url }}" class="btn">🚀 Return to Telegram & Get Files</a>
            <script>
                setTimeout(function() {
                    window.location.href = "{{ redirect_url }}";
                }, 2500);
            </script>
        {% endif %}
    </div>
</body>
</html>
